title: Wallpaper Reactor
description: Reactive & cross-platform live wallpapers.
theme: just-the-docs
color_scheme: bluish-dark

url: https://wallpaperreactor.app

# aux_links:
#   Releases: /releases/

ga_tracking: "G-YYB483JREW"

permalink: pretty

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

# Setting `exclude` replaces Jekyll's defaults, so they are repeated here.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby
  # Working document, not a page.
  - BLOG_GUIDELINES.md
